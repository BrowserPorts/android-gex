# test.conf with its init_t type named start_t: a second policy, for what
# becomes of a context when another policy takes its policy's place.

class process
class file
class dir
class binder

# The kernel's initial SIDs, each by its place in this list: it will not
# load a policy without the ones it uses.
sid kernel
sid security
sid unlabeled
sid fs
sid file
sid file_labels
sid init
sid any_socket
sid port
sid netif
sid netmsg
sid node
sid igmp_packet
sid icmp_socket
sid tcp_socket
sid sysctl_modprobe
sid sysctl
sid sysctl_fs
sid sysctl_kernel
sid sysctl_net
sid sysctl_net_unix
sid sysctl_vm
sid sysctl_dev
sid kmod
sid policy
sid scmp_packet
sid devnull

common file_common { read write getattr ioctl }

class process { transition dyntransition fork sigchld }
class file inherits file_common { execute entrypoint open }
class dir inherits file_common { search add_name }
class binder { call transfer }

default_user file source;
default_role dir target;
default_type file target;
default_range file target low;

sensitivity s0;
sensitivity s1 alias secret;
dominance { s0 s1 }
category c0;
category c1 alias first;
category c2;
level s0:c0.c2;
level s1:c0.c2;

mlsconstrain file { read } (l1 dom l2);
mlsvalidatetrans file (h1 dom h2 or t3 == start_t);

policycap network_peer_controls;
policycap open_perms;

attribute domain;
attribute file_type;

type kernel_t, domain;
type start_t, domain;
type app_t, domain;
type file_t, file_type;
type exec_t, file_type;
type tmp_t, file_type;
typealias file_t alias old_file_t;
type child_t;
typebounds start_t child_t;
permissive app_t;

bool allow_stuff true;
bool other_thing false;

type_transition start_t exec_t:process app_t;
type_transition app_t tmp_t:file file_t "special";
type_transition start_t tmp_t:file file_t "special";
type_transition app_t tmp_t:dir exec_t "other";
type_member app_t tmp_t:dir tmp_t;
type_change app_t file_t:file tmp_t;

allow start_t exec_t:file { read execute open };
allow start_t app_t:process { transition dyntransition };
allow domain file_type:file { read getattr };
allow app_t tmp_t:file ioctl;
auditallow app_t file_t:file write;
dontaudit app_t tmp_t:dir search;
allowxperm app_t tmp_t:file ioctl { 0x5401 0x5402-0x5410 0x8901 };
allow kernel_t start_t:binder { call transfer };

if (allow_stuff && !other_thing) {
    allow app_t tmp_t:file write;
} else {
    allow app_t tmp_t:file open;
}

role system_r;
role system_r types { kernel_t start_t app_t child_t };
role app_r;
role app_r types app_t;
role_transition system_r exec_t:process app_r;
allow system_r app_r;

range_transition start_t exec_t:process s1:c0.c1;

user system_u roles { system_r app_r } level s0 range s0 - s1:c0.c2;
user app_u roles app_r level s0 range s0 - s0:c0;

constrain process transition (u1 == u2 or t1 == start_t);
validatetrans file (r1 == r2 and t3 != app_t);

sid kernel system_u:system_r:kernel_t:s0
sid security system_u:object_r:file_t:s0
sid unlabeled system_u:object_r:file_t:s0
sid fs system_u:object_r:file_t:s0
sid file system_u:object_r:file_t:s0 - s1:c0.c2
sid file_labels system_u:object_r:file_t:s0
sid init system_u:system_r:start_t:s0
sid any_socket system_u:object_r:file_t:s0
sid port system_u:object_r:file_t:s0
sid netif system_u:object_r:file_t:s0
sid netmsg system_u:object_r:file_t:s0
sid node system_u:object_r:file_t:s0
sid igmp_packet system_u:object_r:file_t:s0
sid icmp_socket system_u:object_r:file_t:s0
sid tcp_socket system_u:object_r:file_t:s0
sid sysctl_modprobe system_u:object_r:file_t:s0
sid sysctl system_u:object_r:file_t:s0
sid sysctl_fs system_u:object_r:file_t:s0
sid sysctl_kernel system_u:object_r:file_t:s0
sid sysctl_net system_u:object_r:file_t:s0
sid sysctl_net_unix system_u:object_r:file_t:s0
sid sysctl_vm system_u:object_r:file_t:s0
sid sysctl_dev system_u:object_r:file_t:s0
sid kmod system_u:object_r:file_t:s0
sid policy system_u:object_r:file_t:s0
sid scmp_packet system_u:object_r:file_t:s0
sid devnull system_u:object_r:tmp_t:s0

fs_use_xattr ext4 system_u:object_r:file_t:s0;
fs_use_task pipefs system_u:object_r:tmp_t:s0;
fs_use_trans devpts system_u:object_r:tmp_t:s0;

genfscon proc / system_u:object_r:file_t:s0
genfscon proc /sys system_u:object_r:tmp_t:s0
genfscon proc /sys/kernel -- system_u:object_r:exec_t:s0
genfscon sysfs / system_u:object_r:file_t:s0
# Every policy labels selinuxfs: Linux 6.8 fails a load whose booleans
# find no label there.
genfscon selinuxfs / system_u:object_r:tmp_t:s0

portcon tcp 80 system_u:object_r:file_t:s0
portcon udp 1000-2000 system_u:object_r:tmp_t:s0
netifcon lo system_u:object_r:file_t:s0 system_u:object_r:tmp_t:s0
nodecon 127.0.0.1 255.255.255.255 system_u:object_r:file_t:s0
nodecon ::1 ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff system_u:object_r:tmp_t:s0
